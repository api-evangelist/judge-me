description: >-
  FinOps view of Judge.me spend. Judge.me bills a flat per-store subscription:
  the Forever Free plan is $0 and the Awesome plan is a flat $15 USD per month,
  which is the maximum a store can ever pay. There is no usage-based metering of
  API calls, reviews collected, or widget loads, so cost is fully predictable
  per store and the only optimization lever is whether each store needs the
  Awesome feature set.
notes: >-
  Cost is a flat monthly subscription per store, not metered by API usage.
  Verify current plan pricing on the Judge.me pricing page during
  reconciliation.
