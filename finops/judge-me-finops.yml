meters:
- name: plan_subscription
  description: Flat monthly subscription per store (Forever Free $0 or Awesome $15/month).
  unit: months
  aggregation: sum
  dimensions:
  - account
  - shop
  - plan
principles:
- name: Visibility
  description: Track which stores are on the Awesome plan versus Forever Free to see total monthly subscription spend.
- name: Allocation
  description: Map each Judge.me store subscription to the storefront / brand it supports.
- name: Optimization
  description: Keep stores on Forever Free unless they need Awesome features (site reviews, Q&A, Google Shopping syndication, no branding); $15/month is the hard ceiling.
- name: Accountability
  description: Assign an owner per store subscription and review monthly whether the Awesome features are still being used.
