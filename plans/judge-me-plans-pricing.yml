description: >-
  Judge.me uses a simple two-plan, flat-fee model with no scaling costs. The
  Forever Free plan covers unlimited review requests plus photo and video
  reviews and SEO rich snippets at no cost. The Awesome plan is a flat $15 USD
  per month - the most a store can ever pay - and unlocks site reviews, Q&A,
  custom forms, coupons, AI features, product grouping, Mailchimp sync, Google
  Shopping syndication, and no Judge.me branding. The REST API is available on
  both plans and is not separately metered.
notes: >-
  Pricing is per store. A 15-day free trial of the Awesome plan is offered.
  Verify the current plan feature lists on the Judge.me pricing page during
  reconciliation.
sources:
- https://judge.me/pricing
- https://judge.me/help/en/articles/8415450-judge-me-awesome-plan
